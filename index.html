<!DOCTYPE html>
<html lang="zh-Hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Global Currency Hub</title>
    <meta name="description" content="汇率差（损益）计算器和多币种联动换算，支持 160 多种货币，可离线使用。">
    <meta name="theme-color" content="#4f46e5">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234f46e5' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M4 8h13l-3-3M20 16H7l3 3'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/styles.css">
    <script type="module" src="js/app.js"></script>
</head>
<body>
    <svg xmlns="http://www.w3.org/2000/svg" hidden>
        <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></symbol>
        <symbol id="i-swap" viewBox="0 0 24 24"><path d="M4 8h13l-3-3M20 16H7l3 3"/></symbol>
        <symbol id="i-grip" viewBox="0 0 24 24"><circle cx="9" cy="6" r="1.4"/><circle cx="15" cy="6" r="1.4"/><circle cx="9" cy="12" r="1.4"/><circle cx="15" cy="12" r="1.4"/><circle cx="9" cy="18" r="1.4"/><circle cx="15" cy="18" r="1.4"/></symbol>
        <symbol id="i-x" viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></symbol>
    </svg>

    <main class="app">
        <header class="app-header">
            <h1>Global Currency Hub</h1>
            <p>汇率差计算 &amp; 多币种换算</p>
        </header>

        <div class="tabs" role="tablist" aria-label="工具">
            <button type="button" class="tab" role="tab" id="tab-calc" aria-controls="panel-calc" aria-selected="true">汇率差计算器</button>
            <button type="button" class="tab" role="tab" id="tab-multi" aria-controls="panel-multi" aria-selected="false" tabindex="-1">全币种转换</button>
        </div>

        <!-- 工具 1：汇率差（损益）计算器 -->
        <section class="panel" id="panel-calc" role="tabpanel" aria-labelledby="tab-calc">
            <div class="pair">
                <div class="field">
                    <label for="baseCurrency">持有币种</label>
                    <div class="select-wrap"><select id="baseCurrency"></select></div>
                </div>
                <button type="button" class="icon-btn swap-btn" id="swapBtn" aria-label="互换持有币种和兑换币种" title="互换">
                    <svg class="icon" aria-hidden="true"><use href="#i-swap"/></svg>
                </button>
                <div class="field">
                    <label for="targetCurrency">兑换币种</label>
                    <div class="select-wrap"><select id="targetCurrency"></select></div>
                </div>
            </div>

            <div class="rate-card" aria-live="polite">
                <p class="rate-label">当前汇率</p>
                <p class="rate-value" id="rateValue">—</p>
                <p class="rate-inverse" id="rateInverse"></p>
            </div>

            <div class="field">
                <label for="calcAmount">交易金额 <span class="unit" id="amountUnit"></span></label>
                <input type="text" id="calcAmount" inputmode="decimal" autocomplete="off" placeholder="输入金额">
            </div>

            <div class="field">
                <label for="userTargetRate">目标汇率 <span class="unit" id="targetRateUnit"></span></label>
                <input type="text" id="userTargetRate" inputmode="decimal" autocomplete="off" placeholder="你想锁定的汇率">
                <p class="field-error" id="calcError" hidden></p>
            </div>

            <div class="result" id="calcResult" hidden>
                <div class="result-row">
                    <span>按当前汇率可得</span>
                    <span class="num" id="resNow">—</span>
                </div>
                <div class="result-row">
                    <span>按目标汇率可得</span>
                    <span class="num" id="resTarget">—</span>
                </div>
                <div class="result-total" id="resDiffRow">
                    <span id="resDiffLabel">差额</span>
                    <span class="num" id="resDiff">—</span>
                </div>
            </div>
        </section>

        <!-- 工具 2：多币种联动 -->
        <section class="panel" id="panel-multi" role="tabpanel" aria-labelledby="tab-multi" hidden>
            <p class="hint">在任意一行输入金额，其他币种自动换算。拖动左侧把手可调整顺序（键盘：聚焦把手后按 ↑ ↓）。</p>
            <ul class="multi-list" id="multiList"></ul>
            <div class="add-row">
                <label for="addCurrency" class="visually-hidden">添加币种</label>
                <div class="select-wrap"><select id="addCurrency"></select></div>
            </div>
        </section>

        <footer class="status" id="status">
            <p id="statusText">正在获取汇率…</p>
            <div class="status-actions">
                <a id="attribution" href="https://www.exchangerate-api.com" target="_blank" rel="noopener">Rates By Exchange Rate API</a>
                <button type="button" class="icon-btn refresh-btn" id="refreshBtn" aria-label="刷新汇率" title="刷新汇率">
                    <svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg>
                </button>
            </div>
        </footer>
    </main>
</body>
</html>
